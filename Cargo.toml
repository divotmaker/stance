[package]
name = "stance"
version = "0.0.4"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/divotmaker/stance"
description = "USB camera capture with a pre-roll buffer and trigger-cut MJPEG clips, for golf swing replay"
readme = "README.md"
keywords = ["camera", "uvc", "mjpeg", "golf", "replay"]
categories = ["multimedia::video", "hardware-support"]

[lib]
name = "stance"

[features]
# Turns Flight Relay Protocol `shot_trigger` events into clip triggers
# (`stance::frp`).
frp = ["dep:flightrelay"]
# Pose estimation (`stance::pose`): RTMPose keypoints, a YOLOX person
# detector, single-golfer tracking, filters and the offline clip pass. Loads
# ONNX models from a directory and verifies their SHA-256.
pose = [
    "dep:tract-onnx",
    "dep:tract-linalg",
    "dep:rayon",
    "dep:zune-jpeg",
    "dep:sha2",
]
# Fetches the models over HTTPS into a cache directory (`pose::download`).
pose-download = ["pose", "dep:ureq", "dep:zip"]

[dependencies]
thiserror = "2"
# Camera info, formats and the clip sidecar are serializable.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: sidecar frame rates (nominal and measured fps) parse back
# to exactly the values written, so a read sidecar equals the written one.
serde_json = { version = "1", features = ["float_roundtrip"] }
flightrelay = { version = "0.4", optional = true }
# `pose`: pure-Rust ONNX inference (one executable, no native libraries,
# cross-builds to every target the crate supports). No default features: the
# models need only the core ONNX operators, not `transformers`.
tract-onnx = { version = "0.23", optional = true, default-features = false }
# `pose`: tract's own matrix kernels, with `multithread-mm` so one inference
# can use several cores (a 2-3x lower latency for the live view).
tract-linalg = { version = "0.23", optional = true, features = ["multithread-mm"] }
# `pose`: the thread pool tract's multithreaded kernels run on; built here so
# a failure to start threads is an error, not a panic.
rayon = { version = "1.10", optional = true }
# `pose`: decodes MJPEG frames to RGB for the models.
zune-jpeg = { version = "0.5", optional = true }
# `pose`: verifies model files against the SHA-256 in their `ModelSpec`.
sha2 = { version = "0.11", optional = true }
# `pose-download`: HTTPS (rustls, no OpenSSL) for fetching models; 3.5 for
# its per-read timeout.
ureq = { version = "3.5", optional = true, default-features = false, features = ["rustls"] }
# `pose-download`: extracts the model member from the published zip archives
# (inflate only, pure Rust).
zip = { version = "9", optional = true, default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Encodes the test pattern's frames. Native targets only: wasm builds carry
# no sources.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
jpeg-encoder = "0.7"

# CLOCK_MONOTONIC, and the V4L2 ioctls on Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Media Foundation capture and the QPC clock.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Performance",
] }

[dev-dependencies]
# Decodes frames in tests.
zune-jpeg = "0.5"
# The WebSocket client in examples/frp_record.rs.
flightrelay = { version = "0.4", features = ["transport"] }

[[example]]
name = "frp_record"
required-features = ["frp"]

[[example]]
name = "pose_bench"
required-features = ["pose"]

[[example]]
name = "pose_render"
required-features = ["pose"]

[[example]]
name = "golf_report"
required-features = ["pose"]

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every `unsafe` block carries a `// SAFETY:` comment; this lint enforces it.
undocumented_unsafe_blocks = "warn"
